<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="lib-workflow-title lib-workflow-desc" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<title id="lib-workflow-title">How the library builds a response</title>
<desc id="lib-workflow-desc">LangGraph extracts campaign changes, merges the brief, then clarifies missing details or calculates a plan. Questions and small talk get an optional Ollama answer afterward; the calculated result stays unchanged.</desc>
<rect width="1280" height="720" fill="#ffffff"/>
<defs>
<marker id="lib-workflow-muted" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#68768a"/></marker>
<marker id="lib-workflow-blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4878b8"/></marker>
<marker id="lib-workflow-orange" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45d14"/></marker>
</defs>
<text x="48" y="48" font-size="28" fill="#263343" font-weight="500">How the library builds a response</text>
<text x="48" y="80" font-size="16" fill="#68768a">assistant/workflow.ts coordinates the turn; code owns the plan.</text>
<rect x="40" y="120" width="1200" height="224" rx="8" fill="#f7faff" stroke="#4878b8" stroke-width="1.2" stroke-dasharray="8 8"/>
<text x="64" y="156" font-size="20" fill="#4878b8" font-weight="500">LangGraph · extract → merge → respond</text>
<path data-source="extract" data-target="merge" d="M368 252 H472" fill="none" stroke="#4878b8" stroke-width="2" marker-end="url(#lib-workflow-blue)"/>
<path data-source="merge" data-target="respond" d="M776 252 H880" fill="none" stroke="#4878b8" stroke-width="2" marker-end="url(#lib-workflow-blue)"/>
<path data-source="respond" data-target="return" d="M960 312 V384 Q960 392 952 392 H632 Q624 392 624 400 V480" fill="none" stroke="#4878b8" stroke-width="2" marker-end="url(#lib-workflow-blue)"/>
<path data-source="respond" data-target="answer" d="M1136 312 V480" fill="none" stroke="#4878b8" stroke-width="2" marker-end="url(#lib-workflow-blue)"/>
<path data-source="answer" data-target="return" d="M880 536 H776" fill="none" stroke="#4878b8" stroke-width="2" marker-end="url(#lib-workflow-blue)"/>
<rect x="744" y="364" width="128" height="20" fill="#ffffff"/>
<text x="744" y="380" font-size="12" fill="#68768a" font-weight="500">BRIEF UPDATE</text>
<rect x="992" y="412" width="136" height="40" fill="#ffffff"/>
<text x="992" y="428" font-size="12" fill="#68768a" font-weight="500">QUESTION OR</text>
<text x="992" y="448" font-size="12" fill="#68768a" font-weight="500">SMALL TALK</text>
<g data-node="extract"><rect x="64" y="192" width="304" height="120" rx="6" fill="#fff5e9" stroke="#b45d14" stroke-width="1.2"/>
<text x="80" y="224" font-size="24" fill="#263343" font-weight="500">Extract details</text>
<text x="80" y="256" font-size="16" fill="#68768a">assistant/ollama.ts</text>
<text x="80" y="280" font-size="16" fill="#68768a">Read intent and quoted changes</text>
</g>
<g data-node="merge"><rect x="472" y="192" width="304" height="120" rx="6" fill="#eaf2ff" stroke="#4878b8" stroke-width="1.2"/>
<text x="488" y="224" font-size="24" fill="#263343" font-weight="500">Merge brief</text>
<text x="488" y="256" font-size="16" fill="#68768a">planning/brief.ts</text>
<text x="488" y="280" font-size="16" fill="#68768a">Apply updates; track missing fields</text>
</g>
<g data-node="respond"><rect x="880" y="192" width="336" height="120" rx="6" fill="#eaf2ff" stroke="#4878b8" stroke-width="1.2"/>
<text x="896" y="224" font-size="24" fill="#263343" font-weight="500">Clarify or calculate</text>
<text x="896" y="256" font-size="16" fill="#68768a">recommendation.ts · explanations.ts</text>
<text x="896" y="280" font-size="16" fill="#68768a">Rank plans and write the summary</text>
</g>
<g data-node="answer"><rect x="880" y="480" width="336" height="112" rx="6" fill="#fff5e9" stroke="#b45d14" stroke-width="1.2"/>
<text x="896" y="512" font-size="24" fill="#263343" font-weight="500">Answer the question</text>
<text x="896" y="544" font-size="16" fill="#68768a">assistant/ollama.ts</text>
<text x="896" y="568" font-size="16" fill="#68768a">Use calculated evidence + history</text>
</g>
<g data-node="return"><rect x="472" y="480" width="304" height="112" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="488" y="512" font-size="24" fill="#263343" font-weight="500">Return result</text>
<text x="488" y="544" font-size="16" fill="#68768a">Brief + reply + calculated plan</text>
<text x="488" y="568" font-size="16" fill="#68768a">No plan until the brief is complete</text>
</g>
<text x="48" y="636" font-size="16" fill="#68768a">If answer generation fails, return the calculated summary.</text>
<line x1="48" y1="660" x2="1232" y2="660" stroke="#d9e1eb"/>
<text x="48" y="688" font-size="16" fill="#4878b8">Blue / neutral: application code</text>
<text x="448" y="688" font-size="16" fill="#b45d14">Orange: calls Ollama</text>
</svg>
