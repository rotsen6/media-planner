<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1120" width="1280" height="1120" role="img" aria-labelledby="turn-lifecycle-title turn-lifecycle-desc" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<title id="turn-lifecycle-title">One user turn, from message to plan</title>
<desc id="turn-lifecycle-desc">A top-to-bottom sequence across user, browser UI, Next.js API, workflow and data, and Ollama. Progress streams while the workflow runs. Code merges extracted fields and calculates a plan; questions may get a second model call. The complete result returns to the browser, which reveals the text and pauses before showing the plan. Conversation state stays in the browser. Participant labels link to detailed documentation.</desc>
<rect width="1280" height="1120" fill="#ffffff"/>
<defs>
<marker id="turn-lifecycle-muted" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#68768a"/></marker>
<marker id="turn-lifecycle-blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4878b8"/></marker>
<marker id="turn-lifecycle-orange" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45d14"/></marker>
</defs>
<text x="48" y="48" font-size="28" fill="#263343" font-weight="500">One user turn, from message to plan</text>
<text x="48" y="80" font-size="16" fill="#68768a" font-weight="400">Time runs downward · a complete chat brief or plan question · actor names link to the detailed guides.</text>
